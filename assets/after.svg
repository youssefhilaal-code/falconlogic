<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <radialGradient id="cyberSky" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0b1736" />
      <stop offset="45%" stop-color="#050914" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>
    <linearGradient id="neonElectric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFFF" />
      <stop offset="40%" stop-color="#00A8FF" />
      <stop offset="100%" stop-color="#0055FF" />
    </linearGradient>
    <linearGradient id="neonMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007F" />
      <stop offset="60%" stop-color="#D946EF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="ultraGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="rimGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20" result="rimBlur" />
      <feMerge>
        <feMergeNode in="rimBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="650" fill="url(#cyberSky)" />

  <circle cx="200" cy="180" r="180" fill="#00A8FF" opacity="0.18" filter="url(#rimGlow)" />
  <circle cx="820" cy="220" r="220" fill="#FF007F" opacity="0.2" filter="url(#rimGlow)" />

  <g opacity="0.35">
    <rect x="50" y="200" width="90" height="450" fill="#080e1c" stroke="#00A8FF" stroke-width="0.8" />
    <rect x="170" y="140" width="110" height="510" fill="#0a1224" stroke="#00A8FF" stroke-width="0.8" />
    <rect x="720" y="120" width="130" height="530" fill="#0c1122" stroke="#FF007F" stroke-width="0.8" />
    <rect x="870" y="180" width="100" height="470" fill="#070a14" stroke="#FF007F" stroke-width="0.8" />
    <line x1="185" y1="180" x2="265" y2="180" stroke="#00E5FF" stroke-width="1.5" opacity="0.7" />
    <line x1="185" y1="210" x2="245" y2="210" stroke="#00E5FF" stroke-width="1.5" opacity="0.7" />
    <line x1="740" y1="160" x2="820" y2="160" stroke="#FF007F" stroke-width="1.5" opacity="0.7" />
    <line x1="740" y1="190" x2="800" y2="190" stroke="#FF007F" stroke-width="1.5" opacity="0.7" />
  </g>

  <g transform="translate(500, 260) scale(0.65)" opacity="0.4" filter="url(#ultraGlow)">
    <polygon points="0,-180 160,-60 160,100 0,180 -160,100 -160,-60" fill="none" stroke="#00E5FF" stroke-width="2" />
    <path d="M -100 0 L 0 -80 L 100 0" fill="none" stroke="#00E5FF" stroke-width="3" />
  </g>

  <g transform="translate(360, 120)">
    <path d="M 10 320 C 50 240 230 240 270 320 L 310 530 L -30 530 Z" fill="#0d1424" />
    <path d="M 60 170 C 90 90 190 90 220 170 L 250 350 L 30 350 Z" fill="#141d33" stroke="#1e293b" stroke-width="2" />

    <path d="M 60 170 C 80 120 120 100 140 100 L 140 350 L 30 350 Z" fill="none" stroke="#00E5FF" stroke-width="5" filter="url(#ultraGlow)" />
    <path d="M 220 170 C 200 120 160 100 140 100 L 140 350 L 250 350 Z" fill="none" stroke="#FF007F" stroke-width="5" filter="url(#ultraGlow)" />

    <ellipse cx="140" cy="110" rx="65" ry="80" fill="#111928" stroke="#334155" stroke-width="2" />
    
    <path d="M 95 105 C 120 95 160 95 185 105 L 180 125 C 160 115 120 115 100 125 Z" fill="url(#neonElectric)" filter="url(#ultraGlow)" />
    <line x1="105" y1="115" x2="175" y2="115" stroke="#FFFFFF" stroke-width="2" filter="url(#ultraGlow)" />

    <path d="M 100 160 L 115 190 L 115 220" fill="none" stroke="#00E5FF" stroke-width="3" filter="url(#ultraGlow)" />
    <path d="M 180 160 L 165 190 L 165 220" fill="none" stroke="#FF007F" stroke-width="3" filter="url(#ultraGlow)" />
    <circle cx="115" cy="220" r="4" fill="#00E5FF" filter="url(#ultraGlow)" />
    <circle cx="165" cy="220" r="4" fill="#FF007F" filter="url(#ultraGlow)" />

    <polygon points="140,240 120,270 140,295 160,270" fill="url(#neonElectric)" filter="url(#ultraGlow)" />
    <circle cx="140" cy="268" r="4" fill="#FFFFFF" />
  </g>

  <g stroke="#00E5FF" stroke-width="1.5" opacity="0.6">
    <line x1="120" y1="80" x2="105" y2="150" stroke-dasharray="20 40" />
    <line x1="320" y1="150" x2="305" y2="230" stroke-dasharray="30 50" />
    <line x1="680" y1="90" x2="665" y2="180" stroke-dasharray="25 40" stroke="#FF007F" />
    <line x1="840" y1="200" x2="825" y2="290" stroke-dasharray="20 60" stroke="#FF007F" />
  </g>

  <g fill="#00E5FF" font-family="'Space Grotesk', 'Segoe UI', sans-serif">
    <rect x="730" y="40" width="230" height="95" rx="8" fill="#050d1d" opacity="0.9" stroke="#00A8FF" stroke-width="1.5" filter="url(#ultraGlow)" />
    <text x="748" y="70" font-size="15" font-weight="bold" fill="#00E5FF">FALCON RETOUCHED</text>
    <text x="748" y="92" font-size="12" fill="#E2E8F0">Color Graded · 32-Bit Depth</text>
    <text x="748" y="112" font-size="12" fill="#38BDF8">Volumetric Lighting &amp; FX</text>
  </g>

  <rect x="780" y="580" width="180" height="35" rx="6" fill="#050d1d" opacity="0.9" stroke="#00E5FF" stroke-width="1" />
  <text x="795" y="603" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#00E5FF">PHOTOSHOP / AFTER</text>
</svg>